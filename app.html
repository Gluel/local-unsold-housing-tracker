<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미분양 비교 — 부산 연제구 vs 전국</title>
<style>
  :root{
    --ink:#241435; --sub:#5c527a; --accent:#a233e0; --accent2:#e0499b;
    --accentbg:#f7ecff; --line:#ece3f5; --down:#1f8a4c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#faf7fd;color:var(--ink);line-height:1.6;padding:24px 16px}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  .back{display:inline-block;margin-bottom:16px;color:var(--accent);text-decoration:none;font-size:14px;font-weight:700}
  .btn-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .area-btn{flex:1;min-width:110px;padding:14px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
  .area-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-height:80px}
  .change{font-size:26px;font-weight:900;color:var(--down)}
  .note{font-size:13px;color:var(--sub)}
  .bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin:14px 0 6px}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar{width:100%;max-width:40px;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:6px 6px 0 0}
  .bar-col small{margin-top:6px;color:var(--sub);font-size:12px}
  .bar-col .v{font-size:12px;font-weight:700;margin-bottom:4px}
  .stat-row{display:flex;gap:12px}
  .stat{flex:1;background:var(--accentbg);border-radius:12px;padding:14px}
  .stat .num{font-size:22px;font-weight:900;color:var(--accent)}
  .stat .lbl{font-size:12px;color:var(--sub);margin-top:4px}
  .error{color:#a2306a;background:#fdeaf3;border:1px solid #f3bcd7;padding:12px 14px;border-radius:10px;font-weight:700;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <a href="./index.html" class="back">← 랜딩으로 돌아가기</a>
  <h1>부산 연제구 미분양, 전국과 비교해보기</h1>
  <p class="note" style="margin-bottom:20px">면적 구간을 선택하세요.</p>

  <div class="btn-row">
    <button class="area-btn" data-area="under-60" onclick="selectArea('under-60')">60㎡이하</button>
    <button class="area-btn" data-area="60-85" onclick="selectArea('60-85')">60~85㎡</button>
    <button class="area-btn" data-area="over-85" onclick="selectArea('over-85')">85㎡초과</button>
  </div>

  <div class="card" id="result"><p class="note">면적 구간을 선택하면 결과가 나타납니다.</p></div>
</div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
